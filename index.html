<title>폭우 원인 모둠판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Layout: A3 모둠판(1쪽)을 그대로 깔고, 그 아래 보관함에 A4 카드(2쪽) 12장을 둔다. 모든 길이는 판 너비 기준(cqw). */
  :root {
    --bg: #e6ebee;
    --bar: #f5f7f8;
    --ink: #1c2528;
    --muted: #55656b;
    --line: #c6d0d4;
    --tray: #d8e0e4;
    --tray-line: #9fb0b8;
    --card-edge: #8a979d;
    --btn-bg: #ffffff;
    --btn-ink: #1c2528;
    --btn-line: #aab7bd;
    --nature: #1f4b8a;
    --nature-bg: rgba(31, 75, 138, .16);
    --unsure: #5d6b72;
    --unsure-bg: rgba(93, 107, 114, .20);
    --human: #8a3a12;
    --human-bg: rgba(200, 90, 40, .18);
    --focus: #1f6fe0;
    --font-display: "Jua", "Noto Sans KR", sans-serif;
    --font-body: "Noto Sans KR", system-ui, sans-serif;
    --font-hand: "Gaegu", "Jua", "Noto Sans KR", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12181b;
      --bar: #1b2327;
      --ink: #e7edef;
      --muted: #9fadb3;
      --line: #2e3a3f;
      --tray: #1d2529;
      --tray-line: #46565e;
      --card-edge: #6d7a80;
      --btn-bg: #243036;
      --btn-ink: #e7edef;
      --btn-line: #4a5b63;
      --nature: #9fc2f2;
      --nature-bg: rgba(120, 170, 240, .26);
      --unsure: #b3c0c6;
      --unsure-bg: rgba(180, 195, 202, .26);
      --human: #f4b391;
      --human-bg: rgba(240, 140, 90, .26);
      --focus: #7db2ff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12181b;
    --bar: #1b2327;
    --ink: #e7edef;
    --muted: #9fadb3;
    --line: #2e3a3f;
    --tray: #1d2529;
    --tray-line: #46565e;
    --card-edge: #6d7a80;
    --btn-bg: #243036;
    --btn-ink: #e7edef;
    --btn-line: #4a5b63;
    --nature: #9fc2f2;
    --nature-bg: rgba(120, 170, 240, .26);
    --unsure: #b3c0c6;
    --unsure-bg: rgba(180, 195, 202, .26);
    --human: #f4b391;
    --human-bg: rgba(240, 140, 90, .26);
    --focus: #7db2ff;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    padding-block: 0 28px;
    padding-inline: 0;
  }

  .bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 20px;
    padding: 12px 16px;
    background: var(--bar);
    border-bottom: 1px solid var(--line);
  }
  .bar h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 22px;
    letter-spacing: .01em;
    text-wrap: balance;
  }
  .counts {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    margin: 0;
    padding: 0;
    list-style: none;
    font-size: 14px;
    color: var(--muted);
  }
  .counts li { display: flex; align-items: center; gap: 6px; }
  .counts .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
  .counts b { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 700; min-width: 1ch; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-inline-start: auto; }
  .btn {
    font: 500 14px var(--font-body);
    color: var(--btn-ink);
    background: var(--btn-bg);
    border: 1px solid var(--btn-line);
    border-radius: 6px;
    padding: 8px 14px;
    cursor: pointer;
  }
  .btn:hover { border-color: var(--ink); }
  .btn.warn { border-color: var(--human); color: var(--human); }
  .btn:focus-visible, .card:focus-visible, .field:focus-visible, .hand:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }

  .scroller {
    overflow-x: auto;
    padding-inline: 16px;
    padding-block: 18px 0;
  }
  .world {
    container-type: inline-size;
    width: 100%;
    min-width: 860px;
    max-width: 1500px;
    margin-inline: auto;
  }
  .plane {
    --cw: 11.4cqw;
    --ch: calc(var(--cw) * 373 / 338);
    --stage-h: calc(100cqw * 1755 / 2480);
    position: relative;
    width: 100%;
    height: calc(var(--stage-h) + 34.2cqw);
    user-select: none;
    -webkit-user-select: none;
  }

  .stage {
    position: absolute;
    inset: 0 0 auto 0;
    height: var(--stage-h);
    background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,.18), 0 8px 24px rgba(0,0,0,.14);
  }
  .stage img.board {
    display: block;
    width: 100%;
    height: 100%;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .zone {
    position: absolute;
    top: 22.51%;
    height: 56.58%;
    background: transparent;
    transition: background-color .12s;
    pointer-events: none;
  }
  .zone.z1 { left: 3.468%; width: 30.81%; }
  .zone.z2 { left: 34.52%; width: 30.81%; }
  .zone.z3 { left: 65.56%; width: 30.97%; }
  .zone.z1.on { background: var(--nature-bg); }
  .zone.z2.on { background: var(--unsure-bg); }
  .zone.z3.on { background: var(--human-bg); }

  /* 종이 위에 쓰는 칸은 항상 흰 종이 위이므로 어두운 글씨를 고정한다 */
  .field {
    position: absolute;
    margin: 0;
    padding: 0 .3cqw .2cqw;
    border: 0;
    border-radius: 0;
    background: transparent;
    color: #1c2528;
    font-family: var(--font-hand);
    font-weight: 700;
    font-size: 1.75cqw;
    line-height: 1.1;
  }
  .field.group { left: 88.63%; width: 3.27%; top: 4.73%; height: 3.65%; text-align: center; font-size: 2.5cqw; padding: 0; }
  .field.f1 { left: 18.39%; width: 76.61%; top: 86.44%; height: 3.08%; }
  .field.f2 { left: 19.68%; width: 75.32%; top: 90.31%; height: 3.08%; }
  .field:focus-visible { outline-offset: 0; }

  .tray {
    position: absolute;
    left: 0;
    right: 0;
    top: calc(var(--stage-h) + 1.6cqw);
    height: 32.6cqw;
    background: var(--tray);
    border: 2px dashed var(--tray-line);
    border-radius: 10px;
  }
  .tray p {
    margin: 0;
    padding: 1cqw 1.6cqw;
    font-size: max(13px, 1.25cqw);
    color: var(--muted);
  }

  .card {
    position: absolute;
    width: var(--cw);
    height: var(--ch);
    background: #fff;
    border: 1.5px solid var(--card-edge);
    border-radius: .5cqw;
    box-shadow: 0 1px 2px rgba(0,0,0,.22);
    touch-action: none;
    cursor: grab;
    transition: box-shadow .12s, transform .12s;
  }
  .card img { display: block; width: 100%; height: 100%; pointer-events: none; -webkit-user-drag: none; }
  .card.lift {
    cursor: grabbing;
    transform: scale(1.05) rotate(-1.2deg);
    box-shadow: 0 10px 26px rgba(0,0,0,.34);
  }
  /* 빈 카드: 그림 속 두 줄(373px 높이 중 201px, 279px 위치)에 글씨가 얹힌다 */
  .hand {
    position: absolute;
    left: 8.3%;
    width: 83.7%;
    top: 33%;
    height: 41.8%;
    margin: 0;
    padding: 0;
    border: 0;
    resize: none;
    overflow: hidden;
    background: transparent;
    color: #1c2528;
    font-family: var(--font-hand);
    font-weight: 700;
    font-size: calc(var(--cw) * .1);
    line-height: calc(var(--cw) * 78 / 338);
    cursor: text;
    user-select: text;
    -webkit-user-select: text;
  }

  @media (prefers-reduced-motion: reduce) {
    .card, .zone { transition: none; }
    .card.lift { transform: none; }
  }
</style>

<header class="bar">
  <h1>폭우 원인 모둠판</h1>
  <ul class="counts" aria-label="칸별 카드 수">
    <li style="--c: var(--nature)"><span class="dot"></span>자연의 원인 <b id="n1">0</b></li>
    <li style="--c: var(--unsure)"><span class="dot"></span>어느 쪽일까? <b id="n2">0</b></li>
    <li style="--c: var(--human)"><span class="dot"></span>사람과 관련 있을 것 같은 원인 <b id="n3">0</b></li>
  </ul>
  <div class="actions">
    <button class="btn" id="btnCards" type="button">카드 제자리로</button>
    <button class="btn" id="btnAll" type="button">처음부터 다시</button>
  </div>
</header>

  var LABELS = ["기온이 올라서","자동차를 많이 타서","장마전선이 오래 머물러서","물건을 많이 사고 버려서","공장을 많이 돌려서","태풍이 와서","공기 중에 수증기가 많아져서","전기를 많이 써서","우리 모둠 생각 (빈 카드 1)","우리 모둠 생각 (빈 카드 2)","우리 모둠 생각 (빈 카드 3)","우리 모둠 생각 (빈 카드 4)"];
  // 링크 끝의 #3 같은 값이 모둠 번호다. 모둠마다 저장 공간을 따로 쓴다.
  var HASH = "";
  try { HASH = decodeURIComponent((location.hash || "").replace(/^#/, "")).replace(/[^0-9A-Za-z가-힣]/g, "").slice(0, 2); } catch (e) { HASH = ""; }
  var KEY = "rain-causes-board-v1" + (HASH ? "-g" + HASH : "");

  var CW = 11.4, CH = CW * 373 / 338;
  var STAGE_H = 100 * 1755 / 2480;
  var PLANE_H = STAGE_H + 34.2;
  // 칸 위치(원본 2480×1755 기준 픽셀)
  var ZONES = [
    { l: 86,   r: 850,  el: "zone1", n: "n1" },
    { l: 856,  r: 1620, el: "zone2", n: "n2" },
    { l: 1626, r: 2394, el: "zone3", n: "n3" }
  ];
  var ZT = 395, ZB = 1388;

  var plane = document.getElementById("plane");
  var state = load() || fresh();
  var zTop = 10;
  var cardEls = [];
  var drag = null;

  function trayPos(i) {
    var top = STAGE_H + 1.6;
    var gap = 1.4;
    var rowW = 6 * CW + 5 * gap;
    var x0 = (100 - rowW) / 2;
    var col = i % 6, row = Math.floor(i / 6);
    return { x: x0 + col * (CW + gap), y: top + 4.2 + row * (CH + 1.2) };
  }
  function fresh() {
    var pos = {};
    for (var i = 0; i < 12; i++) { var p = trayPos(i); pos[i] = { x: p.x, y: p.y, z: 10 + i }; }
    return { pos: pos, text: {}, group: "", f1: "", f2: "" };
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return null;
      var s = JSON.parse(raw);
      if (!s || !s.pos) return null;
      for (var i = 0; i < 12; i++) if (!s.pos[i]) return null;
      s.text = s.text || {};
      return s;
    } catch (e) { return null; }
  }
  var saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    }, 150);
  }

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function place(i) {
    var p = state.pos[i], el = cardEls[i];
    el.style.left = p.x + "cqw";
    el.style.top = p.y + "cqw";
    el.style.zIndex = p.z;
  }
  function zoneOf(i) {
    var p = state.pos[i];
    var fx = (p.x + CW / 2) / 100 * 2480;
    var fy = (p.y + CH / 2) / STAGE_H * 1755;
    if (fy < ZT || fy > ZB) return -1;
    for (var k = 0; k < ZONES.length; k++) if (fx >= ZONES[k].l && fx <= ZONES[k].r) return k;
    return -1;
  }
  function refreshCounts() {
    var n = [0, 0, 0];
    for (var i = 0; i < 12; i++) { var z = zoneOf(i); if (z >= 0) n[z]++; }
    for (var k = 0; k < 3; k++) document.getElementById(ZONES[k].n).textContent = n[k];
  }
  function highlight(z) {
    for (var k = 0; k < 3; k++) document.getElementById(ZONES[k].el).classList.toggle("on", k === z);
  }
  function toFront(i) {
    zTop += 1;
    state.pos[i].z = zTop;
    cardEls[i].style.zIndex = zTop;
  }

  function build() {
    for (var i = 0; i < 12; i++) {
      var el = document.createElement("div");
      el.className = "card";
      el.tabIndex = 0;
      el.setAttribute("role", "button");
      el.setAttribute("aria-label", LABELS[i] + " 카드. 끌어서 옮기거나 방향키로 움직여요.");
      el.dataset.id = i;
      var img = document.createElement("img");
      img.alt = "";
      img.draggable = false;
      img.src = "data:image/png;base64," + SRC[i];
      el.appendChild(img);
      if (i >= 8) {
        var ta = document.createElement("textarea");
        ta.className = "hand";
        ta.maxLength = 22;
        ta.rows = 2;
        ta.spellcheck = false;
        ta.setAttribute("aria-label", "우리 모둠 생각 쓰는 칸");
        ta.value = state.text[i] || "";
        (function (idx, area) {
          area.addEventListener("input", function () { state.text[idx] = area.value; save(); });
          area.addEventListener("keydown", function (e) { e.stopPropagation(); });
        })(i, ta);
        el.appendChild(ta);
      }
      plane.appendChild(el);
      cardEls.push(el);
      zTop = Math.max(zTop, state.pos[i].z);
      place(i);
      attach(el, i);
    }
    refreshCounts();
  }

  function attach(el, i) {
    el.addEventListener("pointerdown", function (e) {
      if (e.target.closest("textarea")) return;
      if (e.pointerType === "mouse" && e.button !== 0) return;
      var r = plane.getBoundingClientRect();
      var unit = r.width / 100;
      var p = state.pos[i];
      drag = { i: i, unit: unit, left: r.left, top: r.top,
               dx: (e.clientX - r.left) / unit - p.x,
               dy: (e.clientY - r.top) / unit - p.y };
      el.setPointerCapture(e.pointerId);
      el.classList.add("lift");
      toFront(i);
      e.preventDefault();
    });
    el.addEventListener("pointermove", function (e) {
      if (!drag || drag.i !== i) return;
      var p = state.pos[i];
      p.x = clamp((e.clientX - drag.left) / drag.unit - drag.dx, 0, 100 - CW);
      p.y = clamp((e.clientY - drag.top) / drag.unit - drag.dy, 0, PLANE_H - CH);
      el.style.left = p.x + "cqw";
      el.style.top = p.y + "cqw";
      highlight(zoneOf(i));
    });
    function end(e) {
      if (!drag || drag.i !== i) return;
      drag = null;
      el.classList.remove("lift");
      highlight(-1);
      refreshCounts();
      save();
    }
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", end);
    el.addEventListener("keydown", function (e) {
      var step = e.shiftKey ? 4 : 1, dx = 0, dy = 0;
      if (e.key === "ArrowLeft") dx = -step;
      else if (e.key === "ArrowRight") dx = step;
      else if (e.key === "ArrowUp") dy = -step;
      else if (e.key === "ArrowDown") dy = step;
      else return;
      e.preventDefault();
      var p = state.pos[i];
      p.x = clamp(p.x + dx, 0, 100 - CW);
      p.y = clamp(p.y + dy, 0, PLANE_H - CH);
      toFront(i);
      place(i);
      refreshCounts();
      save();
    });
  }

  // 판 위의 글 칸
  var group = document.getElementById("group"), f1 = document.getElementById("f1"), f2 = document.getElementById("f2");
  if (HASH && !state.group) { state.group = HASH; save(); }
  group.value = state.group || ""; f1.value = state.f1 || ""; f2.value = state.f2 || "";
  group.addEventListener("input", function () { state.group = group.value; save(); });
  f1.addEventListener("input", function () { state.f1 = f1.value; save(); });
  f2.addEventListener("input", function () { state.f2 = f2.value; save(); });

  // 버튼: 한 번 더 눌러야 실행된다(확인 창이 열리지 않는 화면이라 버튼 안에서 확인)
  function twoStep(btn, ask, run) {
    var orig = btn.textContent, t = null, armed = false;
    btn.addEventListener("click", function () {
      if (!armed) {
        armed = true;
        btn.textContent = ask;
        btn.classList.add("warn");
        t = setTimeout(reset, 3500);
        return;
      }
      reset();
      run();
    });
    function reset() { armed = false; clearTimeout(t); btn.textContent = orig; btn.classList.remove("warn"); }
  }
  twoStep(document.getElementById("btnCards"), "한 번 더 누르면 제자리로", function () {
    for (var i = 0; i < 12; i++) { var p = trayPos(i); state.pos[i] = { x: p.x, y: p.y, z: 10 + i }; zTop = Math.max(zTop, 10 + i); place(i); }
    refreshCounts(); save();
  });
  twoStep(document.getElementById("btnAll"), "한 번 더 누르면 모두 지워요", function () {
    state = fresh();
    zTop = 22;
    for (var i = 0; i < 12; i++) {
      place(i);
      var ta = cardEls[i].querySelector("textarea");
      if (ta) ta.value = "";
    }
    group.value = f1.value = f2.value = "";
    refreshCounts(); save();
  });

  build();
})();
